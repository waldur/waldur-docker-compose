# Web shell add-on route (development only).
#
# Included by the main Caddyfile via `import /etc/caddy-includes/*.conf`. The
# route is always present; it returns 502 unless the `web-shell` Compose
# profile is running, since `waldur-mastermind-web-shell` does not exist as a
# DNS name on the Compose network otherwise.
#
# The page sets its own Content-Security-Policy, and the web shell checks the
# Host and Origin headers, which Caddy passes through unchanged. WebSocket
# upgrades on /webshell/ws are proxied as-is.
route /webshell* {
	reverse_proxy http://waldur-mastermind-web-shell:8090
}

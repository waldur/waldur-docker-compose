# Matrix chat add-on routes.
#
# Included by the main Caddyfile via `import /etc/caddy-includes/*.conf`. The
# routes are always present; they return 502 when the `matrix` /
# `matrix-rtc` Compose profiles are not active, since `tuwunel` does not
# exist as a DNS name on the Compose network. That is operator-correct: the
# add-on either works or fails loudly.
#
# Call tokens come from Waldur's API at /api/matrix/livekit/ (routed with the
# rest of /api/ in the main Caddyfile, which also keeps its credentialed
# CORS headers off those paths).

# `header_down -Access-Control-Allow-Origin` strips the ACAO:* that tuwunel
# and LiveKit each set themselves, so it doesn't collide with the
# site-wide `import cors` in the main Caddyfile (which echoes the request
# Origin). Two ACAO headers make browsers and Element Desktop (Electron) reject
# the response: external Matrix clients can't validate the homeserver, and a
# homeport served from another origin (an MR preview against this backend)
# can't reach the homeserver. Only matters cross-origin; Waldur's own
# same-origin chat and calls are unaffected either way.

# Proxy .well-known/matrix/* to tuwunel so its [global.well_known]
# config is honoured — including the org.matrix.msc4143.rtc_transports
# block that the matrix-rtc profile adds. A static `respond` here would
# drop the rtc_transports key, leaving homeport's call
# discovery (useLiveKitToken.discover()) with no LiveKit URL and hiding
# the call icon even when LiveKit is up.
reverse_proxy /.well-known/matrix/* http://tuwunel:6167 {
	header_down -Access-Control-Allow-Origin
}

reverse_proxy /_matrix/* http://tuwunel:6167 {
	header_down -Access-Control-Allow-Origin
}
reverse_proxy /_synapse/client/* http://tuwunel:6167 {
	header_down -Access-Control-Allow-Origin
}
# Not served: Waldur calls the admin API on the internal network
# (MATRIX_HOMESERVER_URL), and the one-time setup in the docs runs there too.
respond /_synapse/admin/* 404

# LiveKit signaling (HTTP + WebSocket). Caddy upgrades WS transparently.
# `handle_path` strips the `/livekit` prefix so LiveKit sees `/rtc/v1`
# instead of `/livekit/rtc/v1`. The browser-facing URL is what Waldur
# returns with each call token (MATRIX_LIVEKIT_PUBLIC_URL,
# wss://${WALDUR_DOMAIN}/livekit);
# media still flows directly to the host on ${WALDUR_MATRIX_RTC_TCP_PORT}/
# ${WALDUR_MATRIX_RTC_UDP_PORT}, not through Caddy.
handle_path /livekit/* {
	reverse_proxy http://livekit:7880 {
		header_down -Access-Control-Allow-Origin
	}
}

# Matrix chat add-on routes.
#
# Included by the main Caddyfile via `import /etc/caddy-includes/*.conf`. The
# routes are always present; they return 502 when the `matrix` /
# `matrix-rtc` Compose profiles are not active, since `tuwunel` does not
# exist as a DNS name on the Compose network. That is operator-correct: the
# add-on either works or fails loudly.

# `header_down -Access-Control-Allow-Origin` strips tuwunel's own ACAO:* so it
# doesn't collide with the site-wide `import cors` in the main Caddyfile (which
# echoes the request Origin). Two ACAO headers make Chromium clients — the web
# app and Element Desktop (Electron) — reject the response, so external Matrix
# clients can't validate the homeserver. Only matters cross-origin; Waldur's
# own same-origin chat is unaffected either way.

# Proxy .well-known/matrix/* to tuwunel so its [global.well_known]
# config is honoured — including the org.matrix.msc4143.rtc_transports
# block that the matrix-rtc profile adds. A static `respond` here would
# drop the rtc_transports key, leaving Element Call / homeport's call
# discovery (useLiveKitToken.discover()) with no LiveKit URL and hiding
# the call icon even when LiveKit is up.
reverse_proxy /.well-known/matrix/* http://tuwunel:6167 {
	header_down -Access-Control-Allow-Origin
}

reverse_proxy /_matrix/* http://tuwunel:6167 {
	header_down -Access-Control-Allow-Origin
}
reverse_proxy /_synapse/client/* http://tuwunel:6167 {
	header_down -Access-Control-Allow-Origin
}
reverse_proxy /_synapse/admin/* http://tuwunel:6167 {
	header_down -Access-Control-Allow-Origin
}

# lk-jwt-service shares tuwunel's network namespace; port 8080 inside that
# namespace reaches it. Only active when the `matrix-rtc` profile is up.
# `handle_path` strips the `/lk-jwt` prefix so clients hit lk-jwt's
# `/sfu/get` endpoint instead of `/lk-jwt/sfu/get` (which would 404).
handle_path /lk-jwt/* {
	reverse_proxy http://tuwunel:8080
}

# LiveKit signaling (HTTP + WebSocket). Caddy upgrades WS transparently.
# `handle_path` strips the `/livekit` prefix so LiveKit sees `/rtc/v1`
# instead of `/livekit/rtc/v1`. The browser-facing URL is what
# lk-jwt-service advertises via LIVEKIT_URL=wss://${WALDUR_DOMAIN}/livekit;
# media still flows directly to the host on ${WALDUR_MATRIX_RTC_TCP_PORT}/
# ${WALDUR_MATRIX_RTC_UDP_PORT}, not through Caddy.
handle_path /livekit/* {
	reverse_proxy http://livekit:7880
}

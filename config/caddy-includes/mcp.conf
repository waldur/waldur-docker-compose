# Remote MCP server routes.
#
# Included by the main Caddyfile via `import /etc/caddy-includes/*.conf`. The
# routes are always present. Without the `mcp` Compose profile, /mcp and its
# metadata return 502, since `waldur-mastermind-mcp` does not exist as a DNS
# name on the Compose network. The OAuth endpoints belong to the API, which
# answers 404 on them while the MCP_ENABLED setting is off.
#
# The main Caddyfile keeps its credentialed CORS headers off the OAuth paths:
# MCP clients call them from their own origin, and Waldur answers with its own
# `Access-Control-Allow-Origin: *`.

# The endpoint, and its RFC 9728 metadata at
# /.well-known/oauth-protected-resource/mcp, which tells clients where to get a
# token.
reverse_proxy /mcp* http://waldur-mastermind-mcp:8091
reverse_proxy /.well-known/oauth-protected-resource* http://waldur-mastermind-mcp:8091

# The API's OAuth endpoints only, not all of /oauth/: the consent page at
# /oauth/consent is the portal's, and stays on the catch-all route.
reverse_proxy /.well-known/oauth-authorization-server* http://waldur-mastermind-api:8080
reverse_proxy /oauth/authorize* http://waldur-mastermind-api:8080
reverse_proxy /oauth/token* http://waldur-mastermind-api:8080
reverse_proxy /oauth/revoke_token* http://waldur-mastermind-api:8080
reverse_proxy /oauth/register* http://waldur-mastermind-api:8080

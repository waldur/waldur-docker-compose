## Clustering
cluster_partition_handling = ignore

## Defaults
# During the first start, RabbitMQ will create a vhost and a user
# These config items control what gets created
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*
log.console = true
default_vhost = /

## Networking
listeners.tcp.default = 5672

## Management
management.tcp.ip = 0.0.0.0
management.tcp.port = 15672
loopback_users = none

## Resource limits
# Set a free disk space limit to 1GB. When below this limit, RabbitMQ will stop accepting new connections.
disk_free_limit.absolute = 1GB

## RabbitMQ 4.3 compatibility
# RabbitMQ 4.3 denies transient, non-exclusive queues by default, the
# combination kombu's pidbox and Celery's gossip queues declare. Mastermind
# now declares both exclusive (CELERY_CONTROL_QUEUE_EXCLUSIVE /
# CELERY_EVENT_QUEUE_EXCLUSIVE), so this flag is only needed while this stack
# pins a mastermind image that predates that change. It is read at node boot
# and is accepted on 4.1, 4.2 and 4.3 alike, so it can be set or removed at
# any point in the version walk.
deprecated_features.permit.transient_nonexcl_queues = true
